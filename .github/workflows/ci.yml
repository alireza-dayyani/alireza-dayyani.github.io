name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AlirezaDayyani.Portfolio.slnx

      - name: Build
        run: dotnet build AlirezaDayyani.Portfolio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AlirezaDayyani.Portfolio.slnx --configuration Release --no-build
